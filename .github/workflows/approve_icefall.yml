name: Eingereichten Eisfall übernehmen

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: approve-icefall
  cancel-in-progress: false

jobs:
  add:
    # Nur der Repo-Inhaber kann so übernehmen, nicht wer das Issue eingereicht hat.
    if: >-
      github.event.label.name == 'approved' &&
      github.event.sender.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'new-icefall')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add to new_icefalls.csv
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/approve_icefall.py

      - name: Commit
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add add_new/new_icefalls.csv
          git diff --cached --quiet || git commit -m "Eisfall aus Issue $ISSUE_NUMBER übernommen"
          git pull --rebase
          git push

      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY" --comment "Thanks! The icefall is queued and will appear on the map after the next data update."

      - name: Report problem
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY" --body "This submission could not be added automatically. Please check the name and coordinates."
